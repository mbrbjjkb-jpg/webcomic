name: check

# 日本時間 0:05 / 6:05 / 12:05 / 18:05 に相当（cron は UTC）
on:
  schedule:
    - cron: "5 15,21,3,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    # 初回は348件すべての詳細ページ取得で時間がかかるため長めに取る
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run checker
        run: python checker.py

      - name: Commit and push (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/thumbs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "check: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

